<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <style>html{touch-action:manipulation}</style>
  <meta name="theme-color" content="#0e201b" id="metaThemeColor">
  <title>تعلم التجويد — تحفة الأطفال والجزرية | زاد المسلم</title>
  <meta name="description" content="تعلّم التجويد من متني تحفة الأطفال والمقدمة الجزرية: نص موثّق مشكول، وشرح مبسّط لكل بيت، والاستماع إلى المتن بأصوات كبار القراء بيتًا بيتًا، مع حفظ التسجيل للاستماع دون اتصال.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://solimananas.github.io/Tasbee7/pages/tajweed.html">
  <meta property="og:title" content="تعلم التجويد | زاد المسلم">
  <meta property="og:description" content="تحفة الأطفال والجزرية مع شرح مبسّط لكل بيت والاستماع إلى المتن بيتًا بيتًا.">
  <meta property="og:image" content="https://solimananas.github.io/Tasbee7/og-image.png">
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/hadith-book.css">
  <link rel="stylesheet" href="../css/tajweed-fonts.css">
  <style>
    /* ---------- matn tabs ---------- */
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .tab { padding: 10px 8px; border-radius: 14px; background: rgba(255,255,255,.08); border: 1px solid rgba(230,192,104,.25); color: #fff; font-weight: 800; font-size: .92rem; }
    .tab small { display: block; font-weight: 500; font-size: .7rem; opacity: .8; }
    .tab.on { background: #e6c068; color: #13241d; border-color: #e6c068; }
    /* the matn card: a gold-framed arch over a mosque at dusk (images/tajweed-hero.webp, 720×1015);
       the text sits inside the arch, above the scene */
    .hero.tj-hero { max-width: 460px; margin: 0 auto; aspect-ratio: 720 / 1015; padding: 17% 10% 30%;
      display: flex; flex-direction: column; justify-content: center;
      background: url('../images/tajweed-hero.webp') center / 100% 100% no-repeat; border: 0; border-radius: 8.27% / 5.86%; box-shadow: 0 18px 40px -26px rgba(0,0,0,.7); }
    .hero.tj-hero::after { display: none; }
    .tj-hero h1 { font-size: 1.85rem; line-height: 1.35; text-shadow: 0 2px 10px rgba(0,0,0,.45); }
    .tj-hero .hero-author { margin-top: 4px; }
    .tj-hero .tabs { margin-top: 16px; }
    .tj-hero .tab { background: rgba(4,30,24,.55); }
    .tj-hero .tab.on { background: #e6c068; }
    .tj-hero .tj-continue { align-self: center; }
    @media (max-width: 360px) { .tj-hero h1 { font-size: 1.5rem; } .hero.tj-hero { padding-inline: 8%; } .tj-hero .tab { font-size: .82rem; padding: 8px 4px; } }
    .hero-note { max-width: 460px; margin: 10px auto 0; padding: 0 6px; font-size: .74rem; line-height: 1.75; color: var(--text-muted); text-align: center; }
    /* ---------- chapters + options ---------- */
    .tj-bar { position: sticky; top: calc(max(10px, env(safe-area-inset-top)) + 61px); z-index: 5; margin: 14px -16px 0; padding: 8px 16px 6px;
      background: var(--bg); }
    .tj-bar::after { content: ''; position: absolute; inset-inline: 0; top: 100%; height: 14px; background: linear-gradient(var(--bg), transparent); pointer-events: none; }
    .tj-chaps { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; padding: 2px 1px; }
    .tj-chaps::-webkit-scrollbar { display: none; }
    .tj-chap { flex: none; padding: 7px 12px; border-radius: 999px; font-size: .8rem; font-weight: 700; border: 1px solid var(--border); background: var(--solid); color: var(--text-muted); font-family: 'Amiri', serif; }
    .tj-chap.on { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
    .tj-opts { display: flex; align-items: center; gap: 10px; margin-top: 7px; font-size: .8rem; color: var(--text-muted); }
    .tj-opts label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .tj-opts input { accent-color: var(--accent); width: 16px; height: 16px; }
    /* ---------- abyat ---------- */
    .ch-title { margin: 22px 4px 8px; font-family: 'Amiri', serif; font-size: 1.25rem; color: var(--gold); text-align: center; }
    .ch-title::before, .ch-title::after { content: '۞'; font-size: .8rem; margin: 0 8px; opacity: .7; }
    .bayt { position: relative; margin-top: 10px; border-radius: 18px; padding: 12px 14px 12px; background: var(--card-bg); border: 1px solid var(--border); box-shadow: var(--card-shadow); scroll-margin-top: 150px; transition: border-color .25s, box-shadow .25s; }
    .bayt.playing { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg), var(--card-shadow); }
    .b-head { display: flex; align-items: center; gap: 8px; }
    .b-num { min-width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: .8rem; color: var(--gold); background: var(--gold-soft); }
    .b-head .spacer { flex: 1; }
    .b-play { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--accent-bg); color: var(--accent); }
    .b-play svg { width: 15px; height: 15px; fill: currentColor; }
    .bayt.playing .b-play { background: var(--accent); color: #fff; }
    .b-text { font-family: var(--matn-font, 'Amiri', serif); font-size: var(--matn-size, 1.32rem); line-height: 2.05; text-align: center; margin-top: 4px; color: var(--text); }
    .b-text .sh { display: block; }
    @media (min-width: 640px) { .b-text { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; } .b-text .sh:first-child { text-align: right; } .b-text .sh:last-child { text-align: left; } }
    .b-sharh { margin-top: 8px; padding: 9px 12px; border-radius: 12px; background: var(--accent-bg); font-family: var(--sharh-font, inherit); font-size: var(--sharh-size, .92rem); line-height: 1.85; color: var(--text); }
    .b-sharh b { color: var(--accent); font-size: .78rem; margin-inline-end: 4px; }
    body.no-sharh .b-sharh, body.no-sharh .b-dabba { display: none; }
    .b-dabba { margin-top: 7px; font-family: var(--sharh-font, inherit); font-size: calc(var(--sharh-size, .92rem) * .935); }
    .b-dabba summary { cursor: pointer; color: var(--gold); font-weight: 700; font-size: .8rem; list-style: none; }
    .b-dabba summary::-webkit-details-marker { display: none; }
    .b-dabba summary::before { content: '▸ '; }
    .b-dabba[open] summary::before { content: '▾ '; }
    .b-dabba p { margin-top: 6px; line-height: 1.85; color: var(--text-muted); white-space: pre-line; }
    /* ---------- sources ---------- */
    .tj-src { margin-top: 24px; border-radius: 18px; padding: 14px 16px; background: var(--card-bg); border: 1px solid var(--border); font-size: .82rem; line-height: 1.85; color: var(--text-muted); }
    .tj-src h3 { font-size: .9rem; color: var(--gold); margin-bottom: 4px; }
    .tj-src a { color: var(--accent); word-break: break-word; }
    .tj-src p + p { margin-top: 6px; }
    .tj-continue { margin-top: 10px; padding: 7px 14px; border-radius: 999px; background: rgba(230,192,104,.16); border: 1px solid rgba(230,192,104,.45); color: #f3dc9f; font-weight: 700; font-size: .8rem; }
    .tj-continue::before { content: '▶'; font-size: .62rem; margin-inline-end: 6px; }
    .tj-continue[hidden] { display: none; }
    /* the playing bayt: its progress along the bottom edge, a spinner while it loads */
    .bayt { overflow: hidden; }
    .b-prog { position: absolute; inset-inline: 0; bottom: 0; height: 3px; background: var(--accent); transform: scaleX(var(--p, 0)); transform-origin: right; opacity: 0; transition: opacity .2s; }
    [dir="ltr"] .b-prog { transform-origin: left; }
    .bayt.playing .b-prog { opacity: 1; }
    .b-play .i-pause, body.tj-on .bayt.playing .b-play .i-play { display: none; }
    body.tj-on .bayt.playing .b-play .i-pause { display: inline; }
    .bayt.loading .b-play { position: relative; }
    .bayt.loading .b-play svg { opacity: .35; }
    .bayt.loading .b-play::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; border: 2px solid transparent; border-top-color: currentColor; animation: tjspin .8s linear infinite; }
    @keyframes tjspin { to { transform: rotate(360deg); } }
    /* long messages wrap instead of running off the screen */
    .toast { white-space: normal; max-width: calc(100% - 32px); width: max-content; text-align: center; border-radius: 16px; line-height: 1.6; }
    /* ---------- player ---------- */
    .tj-player { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 30; max-width: 560px; margin: 0 auto;
      background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 22px;
      box-shadow: 0 14px 34px -14px rgba(0,0,0,.5); padding: 10px 14px 10px; }
    .tp-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .tp-who { flex: 1; min-width: 0; text-align: start; padding: 2px 4px; border-radius: 12px; color: var(--text); }
    .tp-info { display: block; font-size: .88rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tp-rname { display: flex; align-items: center; gap: 4px; margin-top: 1px; font-size: .76rem; color: var(--accent); font-weight: 700; min-width: 0; }
    .tp-rname > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tp-rname svg { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .tp-ok { color: var(--accent); }
    .tp-slow { flex: none; max-width: 48%; padding: 6px 10px; border-radius: 999px; font-size: .7rem; font-weight: 700; line-height: 1.35; background: var(--gold-soft); color: var(--gold); border: 1px solid var(--border); }
    .tp-seekrow { display: flex; align-items: center; gap: 10px; margin-top: 6px; direction: ltr; }
    .tp-seek { flex: 1; min-width: 60px; height: 22px; -webkit-appearance: none; appearance: none; background: transparent; }
    .tp-seek::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--accent) var(--v, 0%), var(--border) var(--v, 0%)); }
    .tp-seek::-moz-range-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--accent) var(--v, 0%), var(--border) var(--v, 0%)); }
    .tp-seek::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--accent); border: 2px solid var(--solid); }
    .tp-seek::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--solid); }
    .tp-time { flex: none; white-space: nowrap; font-size: .7rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .tp-ctrls { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 4px; direction: ltr; }
    .tp-play { position: relative; width: 50px; height: 50px; flex: none; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px -6px var(--accent); }
    .tp-play svg { width: 20px; height: 20px; fill: currentColor; }
    .tp-spin { position: absolute; inset: -4px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--accent); opacity: 0; }
    .tj-player.loading .tp-spin { opacity: 1; animation: tjspin .8s linear infinite; }
    .tj-player.loading .tp-play svg { opacity: .55; }
    .tp-btn { width: 42px; height: 42px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text); background: var(--accent-bg); }
    .tp-btn svg { width: 17px; height: 17px; fill: currentColor; }
    .tp-btn svg.stroke, .rc-save svg.stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .tp-btn svg.stroke { width: 22px; height: 22px; }
    .tp-btn svg text { fill: currentColor; stroke: none; font: 800 7.5px system-ui, sans-serif; }
    .tp-chip { min-width: 46px; height: 32px; padding: 0 10px; flex: none; border-radius: 999px; border: 1px solid var(--border); font-weight: 800; font-size: .8rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .tp-chip.on { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
    .tj-player [hidden] { display: none !important; }
    .tj-player #tpRepeat[hidden] { display: inline-block !important; visibility: hidden; }   /* the Jazariyya has no per-bayt timings; keep the row balanced */
    main { padding-bottom: 190px; }
    /* ---------- settings ---------- */
    .tj-opts { justify-content: space-between; }
    .tj-aa { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--solid); color: var(--text-muted); font-size: .78rem; font-weight: 700; }
    .tj-aa b { font-family: 'Amiri', serif; color: var(--accent); font-size: .95rem; }
    #tjSet .tj-sheet-card { max-height: 88vh; }
    .set-preview { margin: 6px 0 4px; padding: 10px 12px; border-radius: 16px; background: var(--card-bg); border: 1px solid var(--border); flex: none; }
    .set-preview .b-text { margin: 0; }
    .set-preview .b-sharh { margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }   /* two whole lines */
    .set-scroll { overflow-y: auto; overscroll-behavior: contain; margin: 0 -14px; padding: 4px 14px 6px; }
    .set-sec + .set-sec { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
    .set-sec h4 { font-size: .84rem; font-weight: 800; color: var(--gold); margin-bottom: 8px; }
    .font-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 7px; }
    .font-card { padding: 8px 6px 6px; border-radius: 14px; border: 1px solid var(--border); background: var(--solid); text-align: center; color: var(--text); }
    .font-card .fs { display: block; font-size: 1.25rem; line-height: 1.9; white-space: nowrap; }
    .font-card small { display: block; font-size: .7rem; color: var(--text-muted); font-family: 'Tajawal', sans-serif; }
    .font-card.on, .font-chips button.on { border-color: var(--accent); background: var(--accent-bg); box-shadow: 0 0 0 1px var(--accent); }
    .font-card.on small { color: var(--accent); font-weight: 700; }
    .font-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .font-chips button { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--border); background: var(--solid); color: var(--text); font-size: .9rem; }
    .set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; font-size: .84rem; }
    .sizer { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 999px; background: var(--solid); }
    .sizer button { width: 44px; height: 38px; font-weight: 800; color: var(--accent); font-family: 'Amiri', serif; font-size: 1rem; }
    .sizer output { min-width: 52px; text-align: center; font-weight: 800; font-size: .82rem; font-variant-numeric: tabular-nums; }
    .set-switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 2px; font-size: .88rem; cursor: pointer; }
    .set-switch input { position: absolute; opacity: 0; pointer-events: none; }
    .set-switch i { position: relative; flex: none; width: 44px; height: 26px; border-radius: 99px; background: var(--border); transition: background .2s; }
    .set-switch i::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: inset-inline-start .2s; }
    .set-switch input:checked + i { background: var(--accent); }
    .set-switch input:checked + i::after { inset-inline-start: 21px; }
    .set-switch input:focus-visible + i { outline: 2px solid var(--gold); outline-offset: 2px; }
    .set-reset { display: block; margin: 16px auto 4px; color: var(--text-muted); font-size: .8rem; text-decoration: underline; }
    /* ---------- reciter sheet ---------- */
    .tj-sheet { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,0); transition: background .2s; display: flex; align-items: flex-end; justify-content: center; }
    .tj-sheet.open { background: rgba(0,0,0,.45); }
    .tj-sheet[hidden] { display: none; }
    .tj-sheet-card { width: 100%; max-width: 560px; max-height: 78vh; display: flex; flex-direction: column; background: var(--solid); border-radius: 24px 24px 0 0; border: 1px solid var(--border); border-bottom: 0;
      padding: 8px 14px calc(14px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .22s ease-out; }
    .tj-sheet.open .tj-sheet-card { transform: none; }
    .tj-grab { width: 40px; height: 4px; border-radius: 4px; background: var(--border); margin: 0 auto 8px; }
    .tj-sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .tj-sheet-head h3 { font-size: 1rem; color: var(--text); }
    .sheet-x { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); background: var(--accent-bg); }
    .sheet-x svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
    .tj-sheet-note { font-size: .76rem; line-height: 1.7; color: var(--text-muted); margin: 4px 0 8px; }
    .rc-list { overflow-y: auto; overscroll-behavior: contain; margin: 0 -6px; padding: 0 6px; }
    .rc { display: flex; align-items: center; gap: 8px; padding: 4px; border-radius: 14px; }
    .rc + .rc { margin-top: 2px; }
    .rc.on { background: var(--accent-bg); box-shadow: inset 3px 0 0 var(--accent); }
    .rc.on .rc-name { color: var(--accent); }
    .rc-pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 8px 10px; text-align: start; color: var(--text); }
    .rc-name { min-width: 0; font-weight: 700; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rc-name small { display: block; font-weight: 500; font-size: .72rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .rc-name small b { color: var(--accent); font-weight: 700; }
    .rc-save { position: relative; width: 40px; height: 40px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent); border: 1px solid var(--border); }
    .rc-save svg { width: 19px; height: 19px; }
    .rc-save.done { background: var(--accent); color: #fff; border-color: var(--accent); }
    .rc-save.busy { border-color: transparent; background: conic-gradient(var(--accent) calc(var(--pct) * 1%), var(--border) 0); }
    .rc-save.busy::before { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--solid); }
    .rc-pct { position: relative; font-size: .66rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body data-theme="dark">

<header>
  <div class="toolbar">
    <a href="../index.html" class="hbtn" aria-label="الرئيسية" title="الرئيسية" data-i18n-aria="home" data-i18n-title="home">
      <svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
    </a>
    <div class="htitle"><span data-i18n="tj_title">تعلم التجويد</span><small data-i18n="tj_sub">متون التجويد مع شرح مبسّط لكل بيت</small></div>
    <button class="hbtn" id="tjSetBtn" aria-haspopup="dialog" aria-label="الإعدادات" title="الإعدادات" data-i18n-aria="tj_settings" data-i18n-title="tj_settings">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
    <div class="theme-dock">
      <button class="dot" data-set="light" style="background:#fbf3df;" onclick="setTheme('light')" aria-label="فاتح" data-i18n-aria="hb_theme_light"></button>
      <button class="dot" data-set="sepia" style="background:#d9bf8a;" onclick="setTheme('sepia')" aria-label="عسلي" data-i18n-aria="hb_theme_sepia"></button>
      <button class="dot" data-set="dark" style="background:#0e201b;" onclick="setTheme('dark')" aria-label="داكن" data-i18n-aria="hb_theme_dark"></button>
    </div>
  </div>
</header>

<main>
  <section class="hero tj-hero">
    <div class="hero-kicker" data-i18n="tj_kicker">متون التجويد</div>
    <h1 id="tjTitle">تحفة الأطفال</h1>
    <div class="hero-author" id="tjAuthor"></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-matn="tuhfa">تحفة الأطفال<small data-i18n="tj_tuhfa_n">٦١ بيتًا · للمبتدئين</small></button>
      <button class="tab" role="tab" data-matn="jazariyya">المقدمة الجزرية<small data-i18n="tj_jaz_n">١٠٩ أبيات · للمتقدّمين</small></button>
    </div>
    <button class="tj-continue" id="tjContinue" hidden></button>
  </section>
  <p class="hero-note" id="tjNote"></p>

  <div class="tj-bar">
    <div class="tj-chaps" id="tjChaps"></div>
    <div class="tj-opts">
      <label><input type="checkbox" id="tjHideSharh"> <span data-i18n="tj_hide_sharh">إخفاء الشرح (للحفظ)</span></label>
      <button class="tj-aa" id="tjFontBtn" aria-haspopup="dialog"><b>Aa</b> <span data-i18n="tj_set_fonts">الخط والحجم</span></button>
    </div>
  </div>

  <div id="tjList" aria-live="polite"></div>

  <section class="tj-src" id="tjSrc"></section>
</main>

<div class="tj-player" id="tjPlayer">
  <div class="tp-top">
    <button class="tp-who" id="tpReciter" aria-haspopup="dialog" aria-label="اختيار القارئ وحفظ التسجيل" data-i18n-aria="tj_pick_reciter">
      <span class="tp-info" id="tpInfo">—</span>
      <span class="tp-rname"><span id="tpReciterName"></span>
        <svg class="tp-ok" id="tpSaved" hidden viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17 19 7"/></svg>
        <svg class="tp-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
    </button>
    <button class="tp-slow" id="tpSlow" hidden data-i18n="tj_slow">الاتصال بطيء؟ احفظ التسجيل</button>
  </div>
  <div class="tp-seekrow">
    <input type="range" class="tp-seek" id="tpSeek" min="0" max="1000" value="0" aria-label="الموضع" data-i18n-aria="tj_position">
    <span class="tp-time" id="tpTime">0:00</span>
  </div>
  <div class="tp-ctrls">
    <button class="tp-chip" id="tpRepeat" aria-label="تكرار">×1</button>
    <button class="tp-btn" id="tpPrev" aria-label="البيت السابق"></button>
    <button class="tp-play" id="tpPlay" aria-label="تشغيل" data-i18n-aria="tj_play"><svg viewBox="0 0 24 24" id="tpIcon"><path d="M7 4v16l13-8z"/></svg><span class="tp-spin" aria-hidden="true"></span></button>
    <button class="tp-btn" id="tpNext" aria-label="البيت التالي"></button>
    <button class="tp-chip" id="tpSpeed" aria-label="السرعة">1×</button>
  </div>
</div>

<div class="tj-sheet" id="tjSheet" hidden role="dialog" aria-modal="true" aria-labelledby="tjSheetTitle">
  <div class="tj-sheet-card">
    <div class="tj-grab"></div>
    <div class="tj-sheet-head"><h3 id="tjSheetTitle">القرّاء</h3>
      <button class="sheet-x" aria-label="إغلاق" data-i18n-aria="tj_close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <p class="tj-sheet-note" data-i18n="tj_save_hint">احفظ التسجيل على جهازك ليبدأ فورًا، وتنتقل بين الأبيات بلا انتظار، ويعمل دون اتصال.</p>
    <div class="rc-list" id="tjRcList"></div>
  </div>
</div>

<div class="tj-sheet" id="tjSet" hidden role="dialog" aria-modal="true" aria-labelledby="tjSetTitle">
  <div class="tj-sheet-card">
    <div class="tj-grab"></div>
    <div class="tj-sheet-head"><h3 id="tjSetTitle" data-i18n="tj_settings">الإعدادات</h3>
      <button class="sheet-x" aria-label="إغلاق" data-i18n-aria="tj_close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="set-preview" id="setPreview" aria-hidden="true"></div>
    <div class="set-scroll">
      <section class="set-sec">
        <h4 data-i18n="tj_set_matn_font">خط المتن</h4>
        <div class="font-grid" id="setMatnFonts"></div>
        <div class="set-row"><span data-i18n="tj_set_matn_size">حجم المتن</span>
          <div class="sizer"><button data-size="matn" data-d="-1" aria-label="تصغير" data-i18n-aria="tj_set_smaller">A−</button><output id="setMatnSize">100%</output><button data-size="matn" data-d="1" aria-label="تكبير" data-i18n-aria="tj_set_larger">A+</button></div></div>
      </section>
      <section class="set-sec">
        <h4 data-i18n="tj_set_sharh_font">خط الشرح</h4>
        <div class="font-chips" id="setSharhFonts"></div>
        <div class="set-row"><span data-i18n="tj_set_sharh_size">حجم الشرح</span>
          <div class="sizer"><button data-size="sharh" data-d="-1" aria-label="تصغير" data-i18n-aria="tj_set_smaller">A−</button><output id="setSharhSize">100%</output><button data-size="sharh" data-d="1" aria-label="تكبير" data-i18n-aria="tj_set_larger">A+</button></div></div>
      </section>
      <section class="set-sec">
        <h4 data-i18n="tj_set_display">العرض</h4>
        <label class="set-switch"><span data-i18n="tj_hide_sharh">إخفاء الشرح (للحفظ)</span><input type="checkbox" id="setHideSharh"><i></i></label>
        <label class="set-switch"><span data-i18n="tj_set_dabba_open">إظهار شرح الشيخ الضبّاع مفتوحًا</span><input type="checkbox" id="setDabbaOpen"><i></i></label>
        <label class="set-switch"><span data-i18n="tj_set_follow">متابعة البيت أثناء الاستماع</span><input type="checkbox" id="setFollow"><i></i></label>
      </section>
      <button class="set-reset" id="setReset" data-i18n="tj_set_reset">استعادة الإعدادات الافتراضية</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../js/theme-manager.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/tajweed.js"></script>
<script src="../js/net-status.js"></script>
</body>
</html>
