<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <style>html{touch-action:manipulation}</style>
  <meta name="theme-color" content="#0e201b" id="metaThemeColor">
  <title>تعلم النحو خطوة خطوة — دروس للأطفال والمبتدئين | زاد المسلم</title>
  <meta name="description" content="دروس نحو متدرّجة للأطفال والمبتدئين: تسعة مستويات من الكلمة إلى الإعراب الكامل، في كل درس قاعدة قصيرة وأمثلة ملوّنة من القرآن الكريم ونصائح للوالدين وتمرين، واختبار في آخر كل مستوى.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://solimananas.github.io/Tasbee7/pages/nahw-kids.html">
  <meta property="og:title" content="تعلم النحو خطوة خطوة | زاد المسلم">
  <meta property="og:description" content="دروس نحو متدرّجة للأطفال والمبتدئين مع تمارين واختبارات.">
  <meta property="og:image" content="https://solimananas.github.io/Tasbee7/og-image.png">
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/hadith-book.css">
  <style>
    /* label colours: one per role in a sentence (اسم/فعل/حرف always the same) */
    :root { --k1: #2563eb; --k2: #15803d; --k3: #c2410c; --k4: #7c3aed; --k5: #0f766e; --k6: #be185d; --ok: #15803d; --bad: #c2410c; }
    body[data-theme="dark"], body[data-theme="plain-dark"] { --k1: #7aa7ff; --k2: #5fd08a; --k3: #ffa266; --k4: #b79bff; --k5: #4fd1c5; --k6: #ff8fb8; --ok: #5fd08a; --bad: #ff9a6b; }
    main { padding-bottom: 60px; }
    .nk-loading { padding: 40px 10px; text-align: center; color: var(--text-muted); }
    /* ---------- path ---------- */
    .nk-hero { margin-top: 4px; padding: 20px 18px 18px; border-radius: 24px; text-align: center; color: #fff;
      background: radial-gradient(120% 90% at 100% 0%, #1f6b55 0%, transparent 60%), linear-gradient(160deg, #0f3b2f, #0a241d);
      border: 1px solid rgba(230,192,104,.35); box-shadow: 0 16px 34px -24px rgba(0,0,0,.7); }
    .nk-hero .kick { font-size: .78rem; font-weight: 800; color: #e6c068; letter-spacing: .02em; }
    .nk-hero h1 { margin-top: 4px; font-family: 'Amiri', serif; font-size: 1.9rem; line-height: 1.4; }
    .nk-hero p { margin: 6px auto 0; max-width: 520px; font-size: .86rem; line-height: 1.85; opacity: .9; }
    .nk-stats { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
    .nk-stats div { min-width: 92px; padding: 8px 10px; border-radius: 14px; background: rgba(255,255,255,.08); border: 1px solid rgba(230,192,104,.25); }
    .nk-stats b { display: block; font-size: 1.2rem; color: #f3dc9f; font-variant-numeric: tabular-nums; }
    .nk-stats span { font-size: .72rem; opacity: .85; }
    .nk-go { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 10px 18px; border-radius: 999px; background: #e6c068; color: #13241d; font-weight: 800; font-size: .9rem; text-decoration: none; max-width: 100%; }
    .nk-go span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lv { margin-top: 12px; border-radius: 20px; background: var(--card-bg); border: 1px solid var(--border); box-shadow: var(--card-shadow); overflow: hidden; }
    .lv-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-align: start; color: var(--text); }
    .lv-n { flex: none; width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; color: #fff; background: var(--lc, var(--accent)); }
    .lv-t { flex: 1; min-width: 0; }
    .lv-t h2 { font-family: 'Amiri', serif; font-size: 1.15rem; line-height: 1.45; }
    .lv-t small { display: block; font-size: .74rem; color: var(--text-muted); }
    .lv-p { flex: none; font-size: .76rem; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .lv-chev { flex: none; width: 18px; height: 18px; fill: none; stroke: var(--text-muted); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s; }
    .lv.open .lv-chev { transform: rotate(180deg); }
    .lv-body { display: none; padding: 0 14px 14px; }
    .lv.open .lv-body { display: block; }
    .lv-goal { font-size: .82rem; line-height: 1.8; color: var(--text-muted); }
    .lv-bar { height: 6px; margin: 8px 0 6px; border-radius: 6px; background: var(--border); overflow: hidden; }
    .lv-bar i { display: block; height: 100%; background: var(--lc, var(--accent)); border-radius: 6px; }
    .ls { display: flex; align-items: center; gap: 10px; padding: 10px 6px; border-top: 1px solid var(--border); color: var(--text); text-decoration: none; }
    .ls-n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .78rem; font-weight: 800; background: var(--accent-bg); color: var(--accent); }
    .ls.done .ls-n { background: var(--accent); color: #fff; }
    .ls-t { flex: 1; min-width: 0; font-weight: 700; font-size: .92rem; }
    .st { width: 1em; height: 1em; fill: var(--border); vertical-align: -.12em; }
    .st.on { fill: #e0a800; }
    .stars { flex: none; display: inline-flex; gap: 2px; font-size: 1rem; }
    .tk { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .ls.test { font-weight: 800; }
    .ls.test .ls-n { background: var(--gold-soft); color: var(--gold); }
    .ls.test .ls-t { color: var(--gold); }
    .ls-best { flex: none; font-size: .76rem; font-weight: 800; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .nk-matn { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 14px 16px; border-radius: 18px; background: var(--gold-soft); border: 1px solid var(--border); color: var(--text); text-decoration: none; font-weight: 700; font-size: .9rem; }
    .nk-matn span { flex: 1; }
    .nk-note { margin-top: 14px; font-size: .74rem; line-height: 1.8; color: var(--text-muted); text-align: center; }
    /* ---------- lesson ---------- */
    .nk-crumb { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: .8rem; color: var(--text-muted); }
    .nk-crumb a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .nk-title { margin-top: 6px; font-family: 'Amiri', serif; font-size: 1.7rem; line-height: 1.45; color: var(--text); }
    .nk-rule { margin-top: 12px; padding: 14px 16px; border-radius: 18px; background: var(--card-bg); border: 1px solid var(--border); border-inline-start: 5px solid var(--gold); box-shadow: var(--card-shadow); }
    .nk-rule b { display: block; font-size: .76rem; color: var(--gold); margin-bottom: 2px; }
    .nk-rule p { font-size: 1.08rem; line-height: 1.95; font-weight: 700; color: var(--text); }
    .nk-points { margin: 12px 0 0; padding: 0 20px 0 0; font-size: .95rem; line-height: 2; color: var(--text); }
    [dir="ltr"] .nk-points { padding: 0 0 0 20px; }
    .nk-points li + li { margin-top: 2px; }
    .nk-h { margin: 18px 4px 6px; font-size: .9rem; font-weight: 800; color: var(--gold); }
    .nk-ex { margin-top: 8px; padding: 12px 14px; border-radius: 16px; background: var(--card-bg); border: 1px solid var(--border); }
    .snt { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 4px 9px; font-family: 'Amiri', serif; font-size: 1.45rem; line-height: 1.9; color: var(--text); }
    .w { display: inline-flex; flex-direction: column; align-items: center; }
    .w.l > span { line-height: 1.75; }
    .w.l > span > i { font-style: normal; color: var(--kc); border-bottom: 3px solid var(--kc); }
    .w.l > small { margin-top: 3px; padding: 1px 7px; border-radius: 999px; font-family: 'Tajawal', sans-serif; font-size: .64rem; font-weight: 800; line-height: 1.6; color: var(--kc); background: color-mix(in srgb, var(--kc) 14%, transparent); white-space: nowrap; }
    .k1 { --kc: var(--k1); } .k2 { --kc: var(--k2); } .k3 { --kc: var(--k3); } .k4 { --kc: var(--k4); } .k5 { --kc: var(--k5); } .k6 { --kc: var(--k6); }
    .ex-ref { margin-top: 4px; font-size: .72rem; color: var(--text-muted); }
    .ex-n { margin-top: 4px; font-size: .8rem; color: var(--text-muted); line-height: 1.7; }
    .nk-parent { margin-top: 18px; padding: 12px 14px; border-radius: 18px; background: var(--accent-bg); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border)); }
    .nk-parent summary { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 800; color: var(--accent); list-style: none; }
    .nk-parent summary::-webkit-details-marker { display: none; }
    .nk-parent summary svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nk-parent summary::after { content: '▾'; margin-inline-start: auto; font-size: .8rem; }
    .nk-parent[open] summary::after { content: '▴'; }
    .nk-parent p { margin-top: 8px; font-size: .9rem; line-height: 1.9; color: var(--text); }
    .nk-parent p b { color: var(--accent); }
    .nk-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; margin-top: 18px; padding: 10px 16px; border-radius: 16px; font-weight: 800; font-size: 1rem; text-decoration: none; border: 1px solid var(--border); background: var(--solid); color: var(--text); }
    .nk-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 10px 20px -12px var(--accent); }
    .nk-btn[hidden] { display: none; }
    .nk-pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; }
    .nk-pager .nx { text-align: end; }
    .nk-pager a { font-size: .84rem; font-weight: 700; color: var(--accent); text-decoration: none; padding: 6px 2px; }
    /* ---------- quiz ---------- */
    .qz-top { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
    .qz-x { flex: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--accent-bg); color: var(--text-muted); text-decoration: none; }
    .qz-x svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
    .qz-bar { flex: 1; height: 10px; border-radius: 10px; background: var(--border); overflow: hidden; }
    .qz-bar i { display: block; height: 100%; border-radius: 10px; background: var(--accent); transition: width .3s; }
    .qz-c { flex: none; font-size: .8rem; font-weight: 800; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .qz-name { margin-top: 10px; font-size: .78rem; font-weight: 700; color: var(--gold); }
    .qz-card { margin-top: 6px; padding: 16px; border-radius: 20px; background: var(--card-bg); border: 1px solid var(--border); box-shadow: var(--card-shadow); }
    .qz-p { font-size: 1.05rem; font-weight: 800; line-height: 1.8; color: var(--text); }
    .qz-hint { margin-top: 2px; font-size: .76rem; color: var(--text-muted); }
    .qz-s { margin-top: 12px; }
    .qz-s .snt { justify-content: center; }
    .hl { color: var(--k4); border-bottom: 3px solid var(--k4); }
    .tw { padding: 2px 8px; border-radius: 12px; border: 2px dashed var(--border); background: var(--solid); color: var(--text); font: inherit; line-height: 1.8; }
    .tw.sel { border-style: solid; border-color: var(--k1); background: color-mix(in srgb, var(--k1) 14%, var(--solid)); }
    .tw.right { border-style: solid; border-color: var(--ok); background: color-mix(in srgb, var(--ok) 18%, var(--solid)); }
    .tw.wrong { border-style: solid; border-color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, var(--solid)); text-decoration: line-through; text-decoration-thickness: 1px; }
    .tw:disabled { cursor: default; }
    .qz-o { display: grid; gap: 8px; margin-top: 14px; }
    .qo { min-height: 50px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--border); background: var(--solid); color: var(--text); font-size: 1.02rem; font-weight: 700; text-align: start; line-height: 1.7; }
    .qo.ar { font-family: 'Amiri', serif; font-size: 1.3rem; font-weight: 400; }
    .qo.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, var(--solid)); }
    .qo.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--solid)); }
    .qz-fb { margin-top: 14px; padding: 12px 14px; border-radius: 14px; font-size: .92rem; line-height: 1.85; }
    .qz-fb[hidden] { display: none; }
    .qz-fb.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--text); }
    .qz-fb.no { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--text); }
    .qz-fb b { display: block; font-size: 1rem; }
    .qz-fb.ok b { color: var(--ok); }
    .qz-fb.no b { color: var(--bad); }
    .qz-fb .ar { font-family: 'Amiri', serif; font-size: 1.15rem; }
    /* ---------- result ---------- */
    .rs { margin-top: 18px; padding: 26px 18px; border-radius: 24px; text-align: center; background: var(--card-bg); border: 1px solid var(--border); box-shadow: var(--card-shadow); }
    .rs-stars { display: flex; justify-content: center; gap: 8px; font-size: 2.8rem; }
    .rs h2 { margin-top: 6px; font-size: 1.5rem; color: var(--text); font-variant-numeric: tabular-nums; }
    .rs p { margin-top: 6px; font-size: .92rem; line-height: 1.85; color: var(--text-muted); }
    .rs .nk-btn { margin-top: 12px; }
  </style>
</head>
