    .hero-note { max-width: 560px; margin: 10px auto 0; padding: 0 6px; font-size: .74rem; line-height: 1.75; color: var(--text-muted); text-align: center; }
    .nh-bar { position: sticky; top: calc(max(10px, env(safe-area-inset-top)) + 61px); z-index: 5; margin: 14px -16px 0; padding: 8px 16px 6px; background: var(--bg); }
    .nh-bar::after { content: ''; position: absolute; inset-inline: 0; top: 100%; height: 14px; background: linear-gradient(var(--bg), transparent); pointer-events: none; }

    .nh-opts label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .nh-opts input { accent-color: var(--accent); width: 16px; height: 16px; }
    .sizer { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 999px; background: var(--solid); }
    .sizer button { width: 40px; height: 34px; font-weight: 800; color: var(--accent); font-family: 'Amiri', serif; font-size: 1rem; }
    .sizer output { min-width: 48px; text-align: center; font-weight: 800; font-size: .78rem; font-variant-numeric: tabular-nums; }
    .ch-title { margin: 22px 4px 8px; font-family: 'Amiri', serif; font-size: 1.25rem; color: var(--gold); text-align: center; scroll-margin-top: 200px; }
    .ch-title::before, .ch-title::after { content: '۞'; font-size: .8rem; margin: 0 8px; opacity: .7; }
    .unit { margin-top: 10px; border-radius: 18px; padding: 12px 14px; background: var(--card-bg); border: 1px solid var(--border); box-shadow: var(--card-shadow); }
    .u-num { display: inline-flex; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 10px; align-items: center; justify-content: center; font-weight: 800; font-size: .8rem; color: var(--gold); background: var(--gold-soft); }
    .u-text { font-family: var(--matn-font, 'Amiri', serif); font-size: calc(1.3rem * var(--k, 1)); line-height: 2.1; margin-top: 4px; color: var(--text); text-align: justify; }
    .u-sharh { margin-top: 8px; padding: 9px 12px; border-radius: 12px; background: var(--accent-bg); font-size: calc(.92rem * var(--k, 1)); line-height: 1.9; color: var(--text); }
    .u-sharh b { color: var(--accent); font-size: .78rem; margin-inline-end: 4px; }
    body.no-sharh .u-sharh { display: none; }
    .nh-src { margin-top: 24px; border-radius: 18px; padding: 14px 16px; background: var(--card-bg); border: 1px solid var(--border); font-size: .82rem; line-height: 1.85; color: var(--text-muted); }
    .nh-src h3 { font-size: .9rem; color: var(--gold); margin-bottom: 4px; }
    .nh-src a { color: var(--accent); word-break: break-word; }
    .nh-src p + p { margin-top: 6px; }
    main { padding-bottom: 40px; }
    .nh-lessons { display: block; max-width: 560px; margin: 10px auto 0; padding: 10px 14px; border-radius: 14px; background: var(--gold-soft); border: 1px solid var(--border); color: var(--text); font-weight: 700; font-size: .86rem; text-align: center; text-decoration: none; }
