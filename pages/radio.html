<style>
/* ============================================================
   ADAPTIVE GLASSMORPHISM THEME SYSTEM
   ============================================================ */
:root {
  --bg-image: url('../images/Background-light.webp');
  --bg-surface: rgba(255,255,255,0.45);
  --text-primary: #0F172A;
  --text-secondary: #475569;
  --accent-main: #10B981;
  --accent-rgb: 16,185,129;
  --accent-muted: rgba(16,185,129,0.15);
  --accent-glow: rgba(16,185,129,0.35);
  --glass: rgba(255,255,255,0.6);
  --glass-border: rgba(255,255,255,0.6);
  --glass-shadow: 0 8px 32px 0 rgba(31,38,135,0.07);
  --overlay: rgba(255,255,255,0.2);
  --modal-overlay: rgba(0,0,0,0.3);
  --list-hover: rgba(0,0,0,0.05);
  --live-color: #ef4444;
}
[data-theme="dark"] {
  --bg-image: url('../images/Background-dark.webp');
  --bg-surface: rgba(15,23,42,0.5);
  --text-primary: #F8FAFC;
  --text-secondary: #CBD5E1;
  --accent-main: #10B981;
  --accent-muted: rgba(255,255,255,0.1);
  --accent-glow: rgba(16,185,129,0.3);
  --glass: rgba(30,41,59,0.6);
  --glass-border: rgba(255,255,255,0.1);
  --glass-shadow: 0 8px 32px 0 rgba(0,0,0,0.3);
  --overlay: rgba(15,23,42,0.5);
  --modal-overlay: rgba(0,0,0,0.7);
  --list-hover: rgba(255,255,255,0.05);
  --live-color: #f87171;
}
[data-theme="sepia"] {
  --bg-image: url('../images/background-sepia.webp');
  --bg-surface: rgba(139,90,43,0.3);
  --text-primary: #2D1B0E;
  --text-secondary: #6B4423;
  --accent-main: #C2883A;
  --accent-rgb: 194,136,58;
  --accent-muted: rgba(194,136,58,0.15);
  --accent-glow: rgba(194,136,58,0.28);
  --glass: rgba(255,243,220,0.55);
  --glass-border: rgba(255,255,255,0.5);
  --glass-shadow: 0 8px 32px 0 rgba(101,65,30,0.1);
  --overlay: rgba(255,243,220,0.15);
  --modal-overlay: rgba(61,30,5,0.6);
  --list-hover: rgba(0,0,0,0.05);
  --live-color: #b45309;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;font-family:'Tajawal',sans-serif;
  background-color:var(--bg-surface);
  background-image:var(--bg-image);
  background-size:cover;background-position:center;
  background-attachment:fixed;background-repeat:no-repeat;
  color:var(--text-primary);display:flex;justify-content:center;
  padding:calc(max(12px,env(safe-area-inset-top)) + 28px) 16px 90px;
  min-height:100dvh;
  transition:color .4s,background-image .4s;
}
body::before{
  content:'';position:fixed;inset:0;
  background:var(--overlay);z-index:-1;transition:background .4s;
}
.app{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px}

/* ── Header ──────────────────────────────────────────────── */
.header{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--glass);border:1px solid var(--glass-border);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--glass-shadow);border-radius:16px;padding:11px 15px;
  transition:background .3s,border-color .3s;
}
.header-title{font-weight:700;font-size:1.05rem;color:var(--text-primary)}
.icon-btn{
  background:none;border:none;color:var(--text-primary);
  cursor:pointer;padding:5px;display:flex;align-items:center;justify-content:center;
  transition:.2s;border-radius:8px;
}
.icon-btn:active{opacity:.7;transform:scale(.9)}

/* ── HERO CARD ───────────────────────────────────────────── */
.hero-card{
  background:var(--glass);border:1px solid var(--glass-border);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  box-shadow:var(--glass-shadow);border-radius:26px;
  padding:22px 18px 20px;
  display:flex;flex-direction:column;align-items:center;gap:0;
  transition:background .3s,border-color .3s,box-shadow .4s;
  position:relative;overflow:hidden;
}
body.is-playing .hero-card{
  box-shadow:var(--glass-shadow),0 0 0 1.5px rgba(var(--accent-rgb),.25),0 8px 40px rgba(var(--accent-rgb),.12);
}

/* LIVE badge */
.live-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 13px;border-radius:100px;
  font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  background:rgba(239,68,68,.08);color:rgba(239,68,68,.45);
  border:1px solid rgba(239,68,68,.12);
  margin-bottom:16px;
  transition:background .3s,color .3s,border-color .3s,box-shadow .3s;
}
body.is-playing .live-badge{
  background:rgba(239,68,68,.15);color:var(--live-color);
  border-color:rgba(239,68,68,.3);
  box-shadow:0 0 14px rgba(239,68,68,.18);
}
.live-dot{
  width:7px;height:7px;border-radius:50%;
  background:rgba(239,68,68,.3);flex:0 0 7px;
  transition:background .3s;
}
body.is-playing .live-dot{
  background:var(--live-color);
  animation:livePulse 1.4s ease-in-out infinite;
}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

/* Mandala rings */
.mandala-wrap{
  position:relative;width:220px;height:220px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:14px;flex-shrink:0;
}
.mandala-glow{
  position:absolute;inset:-20px;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--accent-rgb),.18),transparent 68%);
  transition:opacity .4s;opacity:0;
}
body.is-playing .mandala-glow{opacity:1;animation:glowPulse 3s ease-in-out infinite}
@keyframes glowPulse{0%,100%{transform:scale(.95);opacity:.7}50%{transform:scale(1.05);opacity:1}}
.m-ring{
  position:absolute;border-radius:50%;border:1px solid rgba(var(--accent-rgb),.18);
  animation:ringRotate 20s linear infinite;opacity:0;transition:opacity .4s;
}
body.is-playing .m-ring{opacity:1}
.m-ring-1{inset:4px;animation-duration:18s}
.m-ring-2{inset:14px;animation-duration:26s;animation-direction:reverse}
.m-ring-3{inset:24px;animation-duration:34s;border-style:dashed}
@keyframes ringRotate{to{transform:rotate(360deg)}}
.m-dots{
  position:absolute;inset:0;border-radius:50%;
  animation:ringRotate 14s linear infinite;opacity:0;transition:opacity .4s;
}
body.is-playing .m-dots{opacity:1}
.m-dot{
  position:absolute;top:50%;left:50%;width:4px;height:4px;
  border-radius:50%;background:var(--accent-main);
  transform-origin:0 0;opacity:.5;transition:opacity .3s,width .3s,height .3s;
}
body.is-playing .m-dot{opacity:.8;width:5px;height:5px}

/* Album art */
.m-album-wrap{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:162px;height:162px;border-radius:50%;z-index:2;
  overflow:hidden;
  box-shadow:0 6px 28px var(--accent-glow);
  border:2.5px solid rgba(var(--accent-rgb),.22);
  transition:box-shadow .4s;
}
body.is-playing .m-album-wrap{
  box-shadow:0 8px 36px var(--accent-glow),0 0 0 3px rgba(var(--accent-rgb),.15);
}
.m-album{width:100%;height:100%;object-fit:cover;display:block}

/* ── RADIO WAVE SPECTRUM ── */
.waveform{
  display:flex;align-items:flex-end;justify-content:center;gap:3px;
  height:42px;margin:0 auto 16px;
  opacity:0;transition:opacity .6s ease;
  position:relative;
}
body.is-playing .waveform{opacity:1}
/* Frequency glow bed */
.waveform::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(var(--accent-rgb),.14),transparent 70%);
  border-radius:40px;opacity:0;transition:opacity .8s;
  pointer-events:none;
}
body.is-playing .waveform::before{opacity:1;animation:freqGlow 2.4s ease-in-out infinite alternate}
@keyframes freqGlow{0%{opacity:.5}100%{opacity:1}}

.bar{
  width:4px;border-radius:4px;
  background:linear-gradient(to top,var(--accent-main),rgba(var(--accent-rgb),.5));
  flex-shrink:0;transform-origin:bottom;
  transition:opacity .4s;
}
body.is-playing .bar{animation:radioWave var(--wave-dur,1.1s) ease-in-out infinite}
@keyframes radioWave{
  0%,100%{transform:scaleY(.1);opacity:.4}
  30%{transform:scaleY(1);opacity:1}
  60%{transform:scaleY(.6);opacity:.7}
}
/* 15 bars — organic frequency spectrum */
.bar:nth-child(1){height:14px;--wave-dur:1.3s;animation-delay:0s;width:3px}
.bar:nth-child(2){height:22px;--wave-dur:1.0s;animation-delay:.08s;width:4px}
.bar:nth-child(3){height:30px;--wave-dur:1.4s;animation-delay:.18s;width:5px}
.bar:nth-child(4){height:36px;--wave-dur:.95s;animation-delay:.05s;width:4px}
.bar:nth-child(5){height:26px;--wave-dur:1.2s;animation-delay:.22s;width:3px}
.bar:nth-child(6){height:38px;--wave-dur:1.1s;animation-delay:.12s;width:5px}
.bar:nth-child(7){height:20px;--wave-dur:1.5s;animation-delay:.28s;width:3px}
.bar:nth-child(8){height:40px;--wave-dur:.85s;animation-delay:.02s;width:5px}
.bar:nth-child(9){height:32px;--wave-dur:1.25s;animation-delay:.15s;width:4px}
.bar:nth-child(10){height:24px;--wave-dur:1.05s;animation-delay:.20s;width:3px}
.bar:nth-child(11){height:35px;--wave-dur:1.35s;animation-delay:.10s;width:4px}
.bar:nth-child(12){height:18px;--wave-dur:.90s;animation-delay:.25s;width:3px}
.bar:nth-child(13){height:28px;--wave-dur:1.15s;animation-delay:.06s;width:4px}
.bar:nth-child(14){height:34px;--wave-dur:1.45s;animation-delay:.16s;width:5px}
.bar:nth-child(15){height:16px;--wave-dur:1.0s;animation-delay:.30s;width:3px}

/* Track info / station name ticker */
.track-info{
  text-align:center;width:100%;margin-bottom:16px;
  min-height:52px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;overflow:hidden;
}
.hero-station-wrap{overflow:hidden;width:100%;text-align:center}
#nowStation{
  font-family:'Amiri',serif;font-size:1.6rem;font-weight:700;
  display:inline-block;white-space:nowrap;
  color:var(--text-primary);
}
#nowStation.ticker-active{animation:heroTicker var(--ticker-dur,9s) linear infinite}
@keyframes heroTicker{0%{transform:translateX(-50%)}100%{transform:translateX(0)}}
.hero-country{font-size:.8rem;color:var(--text-secondary);margin-top:3px}

/* Controls */
.controls-main{
  display:flex;justify-content:center;align-items:center;gap:26px;
  margin-bottom:4px;
}
.play-pause-btn{
  width:72px;height:72px;border-radius:50%;
  background:var(--accent-main);color:#fff;border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;
  box-shadow:0 4px 20px var(--accent-glow);
  transition:transform .15s,box-shadow .3s;flex-shrink:0;
}
.play-pause-btn:active{transform:scale(.91)}
body.is-playing .play-pause-btn{
  box-shadow:0 4px 28px var(--accent-glow),0 0 0 4px var(--accent-muted);
}
.play-pause-btn svg{width:28px;height:28px;fill:currentColor;position:relative;z-index:1}
.play-ring{
  position:absolute;inset:0;border-radius:50%;
  border:2px solid var(--accent-main);opacity:0;pointer-events:none;
}
body.is-playing .play-ring{opacity:1;animation:spinRing 6s linear infinite}
@keyframes spinRing{to{transform:rotate(360deg)}}

/* Loader spinner */
.play-loader{
  display:none;position:absolute;inset:0;
  border:3px solid rgba(255,255,255,.25);
  border-top-color:#fff;border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.play-pause-btn.loading .play-loader{display:block}
.play-pause-btn.loading #playIcon,
.play-pause-btn.loading #pauseIcon{display:none!important}

.action-btn{
  width:50px;height:50px;border-radius:50%;
  background:var(--accent-muted);border:1px solid var(--glass-border);
  color:var(--text-primary);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.2s;flex-shrink:0;
}
.action-btn svg{width:22px;height:22px;fill:currentColor}
.action-btn:active{transform:scale(.9)}
.action-btn.active{
  background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);
  color:var(--live-color);
}
.action-btn.active svg{filter:drop-shadow(0 0 6px rgba(239,68,68,.4))}

/* ── Station selector card ───────────────────────────────── */
.sel-card{
  background:var(--glass);border:1px solid var(--glass-border);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--glass-shadow);border-radius:18px;
  padding:14px 16px;display:flex;align-items:center;gap:10px;
  cursor:pointer;transition:background .2s,border-color .2s;
  min-width:0;overflow:hidden;
}
.sel-card:active{transform:scale(.99);background:var(--list-hover)}
.sel-icon{
  width:36px;height:36px;border-radius:10px;flex:0 0 36px;
  background:var(--accent-muted);border:1px solid rgba(var(--accent-rgb),.2);
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;
}
.sel-text{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.sel-label{font-size:.7rem;color:var(--accent-main);font-weight:700}
.sel-value-wrap{overflow:hidden;width:100%;min-width:0}
.sel-value{
  font-size:.9rem;font-weight:600;color:var(--text-primary);
  white-space:nowrap;display:inline-block;
}
.sel-value.ticker-active{animation:heroTicker var(--ticker-dur,6s) linear infinite}
.sel-chevron{
  color:var(--text-secondary);flex:0 0 auto;
  transition:transform .2s;
}

/* ── Toast ───────────────────────────────────────────────── */
.toast{
  position:fixed;top:20px;left:50%;transform:translate(-50%,-100px);
  background:var(--accent-main);color:#fff;
  padding:11px 22px;border-radius:30px;
  font-size:.88rem;font-weight:700;z-index:100000;
  transition:.4s;box-shadow:0 4px 16px rgba(0,0,0,.2);
}
.toast.show{transform:translate(-50%,0)}

/* ── Bottom sheets ───────────────────────────────────────── */
.sheet-overlay{
  position:fixed;inset:0;background:var(--modal-overlay);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:9998;opacity:0;pointer-events:none;transition:opacity .3s;
}
.sheet-overlay.active{opacity:1;pointer-events:all}
.bottom-sheet{
  position:fixed;bottom:0;left:0;right:0;height:90vh;
  background:var(--glass);backdrop-filter:blur(35px);-webkit-backdrop-filter:blur(35px);
  border-top:1px solid var(--glass-border);border-radius:28px 28px 0 0;
  transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.9,.4,1.1),background .3s;
  z-index:10000;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,20px);
  box-shadow:0 -10px 40px rgba(0,0,0,.2);
}
.bottom-sheet.active{transform:translateY(0)}
.drag-handle{width:38px;height:4px;background:rgba(150,150,150,.35);border-radius:10px;margin:12px auto;flex-shrink:0}
.sheet-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 20px 14px;border-bottom:1px solid var(--glass-border);flex-shrink:0;
}
.sheet-header h2{font-size:1.3rem;color:var(--text-primary);margin:0;font-weight:800}
.sheet-content{padding:14px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;flex:1}
.search-input{
  width:100%;padding:13px 16px;border-radius:14px;
  border:1px solid var(--glass-border);background:var(--list-hover);
  color:var(--text-primary);font-family:'Tajawal',sans-serif;
  font-size:.95rem;outline:none;transition:.2s;
}
.search-input:focus{border-color:var(--accent-main)}
.selection-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:20px}
.selection-item{
  padding:15px 16px;border-radius:14px;
  background:var(--list-hover);border:1px solid var(--glass-border);
  color:var(--text-primary);font-size:.97rem;font-weight:600;
  text-align:center;cursor:pointer;transition:.2s;
}
.selection-item:active{transform:scale(.98)}
.selection-item.active{
  background:var(--accent-main);color:#fff;border-color:var(--accent-main);
  box-shadow:0 4px 16px rgba(var(--accent-rgb),.3);
}

/* Favorites sheet items */
.fav-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-radius:14px;
  background:var(--list-hover);border:1px solid var(--glass-border);
  cursor:pointer;transition:.2s;gap:10px;
}
.fav-item:active{transform:scale(.98)}
.fav-item-name{font-weight:700;color:var(--text-primary);font-size:.95rem;flex:1;min-width:0;text-align:right}
.fav-del{
  background:rgba(239,68,68,.1);border:none;color:var(--live-color);
  padding:6px 11px;border-radius:10px;cursor:pointer;
  font-weight:700;font-family:'Tajawal',sans-serif;font-size:.82rem;
  flex:0 0 auto;transition:.15s;
}
.fav-del:active{background:rgba(239,68,68,.2);transform:scale(.95)}

/* ============================================================
   UX UPLIFT — transport, status, categories, sleep timer
   ============================================================ */
.controls-main{gap:22px;direction:ltr}
.skip-btn{width:52px;height:52px;border-radius:50%;border:1px solid var(--glass-border);background:var(--accent-muted);color:var(--text-primary);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,background .2s;flex-shrink:0}
.skip-btn svg{width:22px;height:22px;fill:currentColor}
.skip-btn:active{transform:scale(.88)}
.controls-secondary{display:flex;justify-content:center;gap:18px;margin-top:14px}
.controls-secondary .action-btn{width:46px;height:46px;position:relative}
.controls-secondary .action-btn svg{width:20px;height:20px}
.sleep-btn svg{fill:none}
.sleep-btn.on{background:rgba(var(--accent-rgb),.18);border-color:rgba(var(--accent-rgb),.4);color:var(--accent-main)}
.sleep-badge{position:absolute;top:-6px;inset-inline-end:-8px;min-width:22px;padding:1px 6px;border-radius:999px;font-size:.68rem;font-weight:800;
  background:var(--accent-main);color:#fff;line-height:1.5;font-variant-numeric:tabular-nums}
.sleep-badge[hidden]{display:none}
/* connecting / reconnecting */
body.is-connecting .live-badge{background:rgba(245,158,11,.14);color:#d97706;border-color:rgba(245,158,11,.3)}
body.is-connecting .live-dot{background:#f59e0b;animation:livePulse .8s ease-in-out infinite}
.live-time{font-variant-numeric:tabular-nums;letter-spacing:.04em;opacity:.85}
.live-time:empty{display:none}
.live-time::before{content:'·';margin-inline-end:5px}
.now-cat{font-size:.8rem;font-weight:700;color:var(--accent-main);margin-top:4px;min-height:1em}
.radio-error{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:-4px 0 12px;padding:9px 12px;border-radius:14px;
  background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.25);color:var(--live-color);font-size:.82rem;font-weight:700;text-align:center;width:100%}
.radio-error[hidden]{display:none}
.radio-error-retry{border:none;border-radius:999px;padding:6px 14px;background:var(--live-color);color:#fff;font:inherit;font-size:.78rem;cursor:pointer}
/* station sheet */
.sheet-header h2{display:flex;align-items:center;gap:8px}
.sheet-count{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:800;background:var(--accent-muted);color:var(--accent-main)}
.sheet-count:empty{display:none}
.search-input{-webkit-appearance:none;appearance:none;flex-shrink:0}
.cat-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;flex-shrink:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cat-chips::-webkit-scrollbar{display:none}
.cat-chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1px solid var(--glass-border);
  background:var(--list-hover);color:var(--text-primary);font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:.2s}
.cat-chip small{font-size:.7rem;font-weight:800;opacity:.65;font-variant-numeric:tabular-nums}
.cat-chip.active{background:var(--accent-main);border-color:var(--accent-main);color:#fff;box-shadow:0 3px 12px rgba(var(--accent-rgb),.3)}
.cat-chip.active small{opacity:.9}
.selection-item{display:flex;align-items:center;gap:12px;text-align:start;padding:10px 12px}
.st-ico{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-muted);color:var(--accent-main)}
.st-ico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.selection-item.active .st-ico{background:rgba(255,255,255,.22);color:#fff}
.st-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.st-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-sub{font-size:.74rem;font-weight:600;color:var(--text-secondary)}
.selection-item.active .st-sub{color:rgba(255,255,255,.85)}
.st-fav{flex:none;width:34px;height:34px;border-radius:50%;border:none;background:transparent;color:var(--text-secondary);display:grid;place-items:center;cursor:pointer}
.st-fav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.st-fav.on{color:var(--live-color)}
.st-fav.on svg{fill:currentColor}
.selection-item.active .st-fav{color:#fff}
.st-fav:active{transform:scale(.85)}
.sel-eq{flex:none;display:none;align-items:flex-end;gap:2px;height:16px}
.sel-eq i{width:3px;background:currentColor;border-radius:2px;height:40%;animation:eqBar .9s ease-in-out infinite}
.sel-eq i:nth-child(2){animation-delay:.2s}.sel-eq i:nth-child(3){animation-delay:.4s}
body.is-playing .selection-item.active .sel-eq{display:flex}
@keyframes eqBar{0%,100%{height:30%}50%{height:100%}}
.list-empty{text-align:center;padding:30px 10px;color:var(--text-secondary);font-weight:600}
.selection-item:focus-visible,.cat-chip:focus-visible,.sel-card:focus-visible{outline:2px solid var(--accent-main);outline-offset:2px}
/* sleep sheet */
.bottom-sheet.sheet-compact{height:auto;max-height:75vh}
.sleep-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sleep-opt{padding:16px 8px;border-radius:16px;border:1px solid var(--glass-border);background:var(--list-hover);color:var(--text-primary);
  font:inherit;font-weight:800;font-size:1rem;cursor:pointer;transition:.2s}
.sleep-opt small{display:block;font-size:.72rem;font-weight:600;color:var(--text-secondary)}
.sleep-opt.active{background:var(--accent-main);border-color:var(--accent-main);color:#fff}
.sleep-opt.active small{color:rgba(255,255,255,.85)}
.sleep-remaining{text-align:center;font-size:2rem;font-weight:800;color:var(--accent-main);font-variant-numeric:tabular-nums;direction:ltr}
.sleep-remaining[hidden],.sleep-cancel[hidden]{display:none}
.sleep-cancel{margin-top:6px;padding:13px;border-radius:14px;border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.1);color:var(--live-color);font:inherit;font-weight:800;cursor:pointer}
.toast{max-width:90vw;text-align:center;top:calc(env(safe-area-inset-top,0px) + 84px);opacity:0;pointer-events:none;transition:transform .4s,opacity .3s}
.toast.show{opacity:1}
.toast.error{background:var(--live-color)}
@media (prefers-reduced-motion: reduce){.sel-eq i,body.is-connecting .live-dot{animation:none}}

/* ============================================================
   COMPACT PLAYER — fits one phone screen without scrolling
   ============================================================ */
.hero-card{padding:16px 16px 18px}
.live-badge{margin-bottom:10px}
/* art scales with the screen height: bigger on tall phones, still no scroll on short ones */
.mandala-wrap{--art:clamp(130px,22vh,200px);width:var(--art);height:var(--art);margin-bottom:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:50%}
.m-album-wrap{width:calc(var(--art)*.74);height:calc(var(--art)*.74)}
.mandala-wrap:focus-visible{outline:2px solid var(--accent-main);outline-offset:6px}
.waveform{height:24px;margin:0 auto 8px;gap:2px}
.bar{transform-origin:bottom}
.bar:nth-child(odd){height:16px}.bar:nth-child(even){height:22px}.bar:nth-child(3n){height:12px}
.track-info{min-height:0;margin-bottom:12px}
#nowStation{font-size:1.4rem}
.now-cat{margin-top:2px}
.play-pause-btn{width:64px;height:64px}
.controls-main{gap:20px}
.skip-btn{width:46px;height:46px}
.skip-btn svg{width:20px;height:20px}
.controls-secondary{margin-top:12px;gap:12px;align-items:center}
.controls-secondary .action-btn{width:42px;height:42px}
.stations-pill{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--glass-border);
  background:var(--accent-muted);color:var(--text-primary);font:inherit;font-weight:800;font-size:.86rem;cursor:pointer}
.stations-pill small{font-size:.72rem;font-weight:800;color:var(--accent-main);font-variant-numeric:tabular-nums}
.stations-pill:active{transform:scale(.95)}
/* short screens: shrink the art a bit more */
@media (max-height:700px){
  .live-badge{margin-bottom:6px}
  .track-info{margin-bottom:8px}
}
/* tap the art to pause / resume the decorative motion */
body.calm .m-ring,body.calm .m-dots,body.calm .mandala-glow,body.calm .bar,body.calm .play-ring,
body.calm .waveform::before{animation-play-state:paused!important}
@media (prefers-reduced-motion: reduce){
  .m-ring,.m-dots,.mandala-glow,.bar,.play-ring,.waveform::before{animation-play-state:paused!important}
}

/* Install prompt */
#install-prompt{display:none}
</style>

<div class="app">

  <!-- Header -->

  <!-- Hero Player Card -->

    <!-- Mandala + album art -->

<!-- Sleep timer sheet -->

<script>
// ── helpers ───────────────────────────────────────────────
// Not named t(): js/i18n.js defines a global t(key, params) after this script.
function rt(key,fb,params){
  let s=(window.I18n&&window.I18n.t(key))||fb||key;
  if(s===key&&fb)s=fb;
  if(params)Object.keys(params).forEach(k=>{s=s.split('{'+k+'}').join(params[k])});
  return s;
}
function haptic(){if(navigator.vibrate)navigator.vibrate(40)}
let toastTimer;
function showToast(msg,isError){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.toggle('error',!!isError);el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600);
}
function readJSON(key,fb){try{const v=JSON.parse(localStorage.getItem(key)||'null');return v==null?fb:v}catch(e){return fb}}
// Arabic-insensitive matching (tashkeel, hamza forms, ة/ه, ى/ي, spaces)
function normAr(s){
  return String(s||'').toLowerCase()
    .replace(/[ً-ٰٟـ]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
    .replace(/[\s\-_()*·.،,]+/g,'');
}

// ── theme ─────────────────────────────────────────────────
const THEMES=['dark','light','sepia'];
function cycleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')||'dark';
  setTheme(THEMES[(THEMES.indexOf(cur)+1)%THEMES.length]);
}
function setTheme(theme){
  document.documentElement.setAttribute('data-theme',theme);
  localStorage.setItem('themeMode',theme);
  updateThemeIcon(theme);
}
function updateThemeIcon(theme){
  document.getElementById('themeIconSun').style.display=theme==='light'?'block':'none';
  document.getElementById('themeIconMoon').style.display=theme==='dark'?'block':'none';
  document.getElementById('themeIconSepia').style.display=theme==='sepia'?'block':'none';
}
window.addEventListener('storage',e=>{if(e.key==='themeMode'&&e.newValue)setTheme(e.newValue)});

// ── sheets ────────────────────────────────────────────────
function openSheet(id){
  const overlay=document.getElementById('sheetOverlay');
  const wasOpen=overlay.classList.contains('active');
  overlay.classList.add('active');
  document.querySelectorAll('.bottom-sheet').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='sleepSheet')renderSleep();
  if(!wasOpen&&window.BackClose)BackClose.opened(hideAllSheets);
}
function hideAllSheets(){
  document.getElementById('sheetOverlay').classList.remove('active');
  document.querySelectorAll('.bottom-sheet').forEach(s=>s.classList.remove('active'));
}
function closeAllSheets(){
  if(document.getElementById('sheetOverlay').classList.contains('active')&&window.BackClose)BackClose.closed();
  hideAllSheets();
}

// ── ticker helpers ────────────────────────────────────────
function ticker(el,text,speed,minDur){
  if(!el)return;
  el.classList.remove('ticker-active');el.style.removeProperty('--ticker-dur');el.textContent=text;
  requestAnimationFrame(()=>{
    const wrap=el.parentElement;if(!wrap)return;
    if(el.scrollWidth>wrap.offsetWidth+2){
      const sep='        ';el.textContent=text+sep+text+sep;
      el.style.setProperty('--ticker-dur',Math.max(minDur,el.scrollWidth/speed).toFixed(1)+'s');
      el.classList.add('ticker-active');
    }
  });
}
function setHeroTicker(text){ticker(document.getElementById('nowStation'),text,80,5)}

// ── mandala dots (generate once) ─────────────────────────
// orbit radius follows the art size (it shrinks on short screens)
function layoutDots(){
  const wrap=document.getElementById('mDots');if(!wrap)return;
  const R=Math.max(40,wrap.offsetWidth/2-4),count=12;
  if(wrap.dataset.r===String(R))return;
  wrap.dataset.r=R;wrap.innerHTML='';
  for(let i=0;i<count;i++){
    const a=(360/count)*i*(Math.PI/180);
    const d=document.createElement('div');d.className='m-dot';
    d.style.cssText=`margin-left:${R*Math.cos(a)}px;margin-top:${R*Math.sin(a)}px`;
    wrap.appendChild(d);
  }
}
layoutDots();
window.addEventListener('resize',layoutDots);

// Tap the art: pause / resume the decorative motion (remembered).
function applyMotion(calm){
  document.body.classList.toggle('calm',calm);
  const w=document.getElementById('mandalaWrap');if(w)w.setAttribute('aria-pressed',String(calm));
}
function toggleMotion(){
  haptic();
  const calm=!document.body.classList.contains('calm');
  applyMotion(calm);
  try{localStorage.setItem('radioCalm',calm?'1':'0')}catch(e){}
  showToast(calm?rt('radio_motion_off','تم إيقاف الحركة'):rt('radio_motion_on','تم تشغيل الحركة'));
}
try{applyMotion(localStorage.getItem('radioCalm')==='1')}catch(e){}

// ============================================================
//  STATIONS — clean names + categories
// ============================================================
const CATS=[
  {id:'all',key:'radio_cat_all',fb:'الكل'},
  {id:'fav',key:'radio_cat_fav',fb:'المفضلة'},

  {id:'general',key:'radio_cat_general',fb:'إذاعات عامة'},
  {id:'reciters',key:'radio_cat_reciters',fb:'القرّاء'},
  {id:'tafsir',key:'radio_cat_tafsir',fb:'تفسير ودروس'},
  {id:'adhkar',key:'radio_cat_adhkar',fb:'أذكار ورقية'},
  {id:'translations',key:'radio_cat_translations',fb:'ترجمات المعاني'}

const CAT_ICON={
  general:'<svg viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="13" rx="2"/><polyline points="16 8 12 3 8 8"/><circle cx="8.5" cy="14.5" r="2"/><line x1="14" y1="12" x2="19" y2="12"/><line x1="14" y1="16" x2="19" y2="16"/></svg>',

  tafsir:'<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',

};
const HEART_SVG='<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';

function categorize(name){
  if(/^ترجمة/.test(name))return 'translations';
  if(/أذكار|الرقية|تكبيرات|السكينة/.test(name))return 'adhkar';
  if(/تفسير|السيرة|قصص|صور من حياة|رياض الصالحين|صحيح|الفتاوى|كتاب|فضل شهر|في ظلال/.test(name))return 'tafsir';
  if(/القرآن الكريم -|الإذاعة العامة|تلاوات|تراتيل|سورة/.test(name))return 'general';
  return 'reciters';
}
// The source names carry decoration ("---سورة البقرة---", "***قصص***", "-تلاوات-").
function cleanName(n){
  return String(n||'').replace(/\*+/g,' ').replace(/-{2,}/g,' ')
    .replace(/(^|\s)-(?=\S)/g,'$1').replace(/(\S)-(?=\s|$)/g,'$1')
    .replace(/^أذاعة/,'إذاعة').replace(/\s+/g,' ').trim();
}
function catLabel(id){const c=CATS.find(x=>x.id===id);return c?rt(c.key,c.fb):''}
function displayName(st){
  if(!st)return'';
  const tr=window.I18n&&I18n.getLang&&I18n.getLang()!=='ar'?I18n.name('stations',st.name,''):'';
  if(tr&&tr!==st.name)return tr;
  let n=cleanName(st.name);
  if(st.cat==='reciters')n=n.replace(/^إذاعة\s+/,'');   // the list already says "reciters"
  return n;
}

let allStations=[];
function buildStations(){
  const seen=new Set();allStations=[];
  (typeof RADIO_STATIONS!=='undefined'?RADIO_STATIONS:[]).forEach(s=>{
    const k=s.name+'|'+s.url;if(seen.has(k))return;seen.add(k);
    allStations.push({name:s.name,url:s.url,fallbacks:s.fallbacks,cat:categorize(s.name)});
  });
}
function stationByUrl(url){return allStations.find(s=>s.url===url)}

// ============================================================
//  PLAYBACK — connection states + auto-reconnect
// ============================================================
const audio=document.getElementById('audio');
const playBtn=document.getElementById('playBtn');
let hls=null,current=null,userWantsPlay=false,hasStartedPlayback=false;
let state='stopped',reconnectTries=0,reconnectTimer=null,stallTimer=null,candIdx=0,internalPause=false;
let listenStart=0,clockTimer=null;
let loadSeq=0,handledSeq=-1;   // a failed load fires both play() rejection and 'error'; count it once
const MAX_RECONNECT=5,RECONNECT_DELAYS=[600,1500,3000,6000,10000];
const _mediaBase=window.location.origin+window.location.pathname.replace(/\/[^/]+\/[^/]*$/,'');

function supportsNativeHLS(){
  return /^((?!chrome|android).)*safari/i.test(navigator.userAgent)&&audio.canPlayType('application/vnd.apple.mpegurl');
}
// qurango.net and backup.qurango.net serve the same streams, and either one
// intermittently answers 500 — so reconnect attempts alternate between them.
function altHostUrl(url){
  if(url.includes('://backup.qurango.net/'))return url.replace('://backup.qurango.net/','://qurango.net/');
  if(url.includes('://qurango.net/'))return url.replace('://qurango.net/','://backup.qurango.net/');
  return url;
}
// Ordered stream candidates for a station; reconnects walk this list.
//  - explicit `fallbacks` (e.g. Sharjah: audio-only AAC on two CDN hosts, then HLS)
//  - qurango stations: the same path on both hosts
// URLs this browser can't decode are skipped up front.
function canPlayUrl(u){
  if(/\.m3u8(\?|$)/.test(u))return supportsNativeHLS()||!!(window.Hls&&Hls.isSupported());
  if(/icecast\.audio|\.aac(\?|$)/.test(u))return audio.canPlayType('audio/aac')!==''||audio.canPlayType('audio/aacp')!=='';
  return true;
}
function candidates(st){
  let list=[st.url].concat(st.fallbacks||[]);
  if(!st.fallbacks&&/qurango\.net/.test(st.url))list=[st.url,altHostUrl(st.url)];
  const ok=list.filter(canPlayUrl);
  return ok.length?ok:list;
}
function streamUrl(){const c=candidates(current);return c[candIdx%c.length]}

function teardown(){
  internalPause=true;
  try{audio.pause()}catch(e){}
  if(hls){hls.destroy();hls=null}
  audio.removeAttribute('src');audio.dataset.loadedUrl='';
  try{audio.load()}catch(e){}
  setTimeout(()=>{internalPause=false},0);
}
function loadStream(url){
  teardown();
  if(url.includes('.m3u8')){
    if(supportsNativeHLS()){audio.src=url}
    else if(window.Hls&&Hls.isSupported()){
      // Not an LL-HLS stream: stay a few segments behind live for stability.
      hls=new Hls({enableWorker:true,lowLatencyMode:false,liveSyncDurationCount:3,
        manifestLoadingMaxRetry:3,levelLoadingMaxRetry:3,fragLoadingMaxRetry:3});
      let recovered=false;
      hls.loadSource(url);hls.attachMedia(audio);
      hls.on(Hls.Events.ERROR,(_,d)=>{
        if(!d.fatal)return;
        if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&!recovered){recovered=true;hls.recoverMediaError();return}
        onStreamFailure();
      });
    }else{showToast(rt('radio_hls_not_supported','المتصفح لا يدعم البث'),true);return false}
  }else{audio.src=url}
  audio.dataset.loadedUrl=url;
  return true;
}

function startPlayback(){
  if(!current){showToast(rt('radio_select_first','اختر إذاعة أولاً'));return}
  userWantsPlay=true;hideRadioError();clearTimeout(reconnectTimer);
  if(state!=='reconnecting')setState('connecting');
  const url=streamUrl();
  if(audio.dataset.loadedUrl!==url&&!loadStream(url)){userWantsPlay=false;setState('stopped');return}
  const seq=++loadSeq;
  armStallWatch();
  const p=audio.play();
  if(p)p.catch(err=>{
    if(!userWantsPlay)return;
    if(err&&err.name==='NotAllowedError'){userWantsPlay=false;setState('stopped');return}
    if(err&&err.name==='AbortError')return;
    onStreamFailure(seq);
  });
}
function stopPlayback(){
  userWantsPlay=false;clearTimeout(reconnectTimer);clearTimeout(stallTimer);
  internalPause=true;audio.pause();setTimeout(()=>{internalPause=false},0);
  // drop a live stream instead of letting it buffer stale audio behind a pause
  if(hls){hls.destroy();hls=null;audio.dataset.loadedUrl=''}
  setState('stopped');
}
function togglePlay(force){
  const want=force!=null?force:!userWantsPlay;
  if(want)startPlayback();else stopPlayback();
}
function retryStation(){reconnectTries=0;candIdx++;audio.dataset.loadedUrl='';startPlayback()}

function onStreamFailure(seq){
  if(!userWantsPlay||!current)return;
  if(seq==null)seq=loadSeq;
  if(seq!==loadSeq||seq===handledSeq)return;   // stale or already handled
  handledSeq=seq;
  clearTimeout(reconnectTimer);clearTimeout(stallTimer);
  if(!navigator.onLine){setState('offline');return}               // resumes on 'online'
  if(reconnectTries>=MAX_RECONNECT){
    userWantsPlay=false;teardown();setState('stopped');
    showRadioError(rt('radio_unavailable','تعذّر الاتصال بهذه الإذاعة حالياً'));
    return;
  }
  const delay=RECONNECT_DELAYS[reconnectTries];
  reconnectTries++;
  candIdx++;                                   // next host / format
  setState('reconnecting');
  reconnectTimer=setTimeout(()=>{if(userWantsPlay){audio.dataset.loadedUrl='';startPlayback()}},delay);
}
// a live stream that stops delivering data without an error event
function armStallWatch(){
  clearTimeout(stallTimer);
  stallTimer=setTimeout(()=>{if(userWantsPlay&&(audio.paused||audio.readyState<3))onStreamFailure()},15000);
}

audio.addEventListener('playing',()=>{
  clearTimeout(stallTimer);reconnectTries=0;hideRadioError();
  if(!listenStart)listenStart=Date.now();
  hasStartedPlayback=true;
  setState('live');addRecent(current);
  document.dispatchEvent(new CustomEvent('_audioPlaying'));
  armLeaveSoon();
});
audio.addEventListener('timeupdate',()=>{if(state==='live')clearTimeout(stallTimer)});
audio.addEventListener('waiting',()=>{if(userWantsPlay&&state==='live'){setState('connecting');armStallWatch()}});
audio.addEventListener('stalled',()=>{if(userWantsPlay)armStallWatch()});
audio.addEventListener('error',()=>{if(userWantsPlay&&audio.getAttribute('src'))onStreamFailure()});
audio.addEventListener('ended',()=>{if(userWantsPlay)onStreamFailure()});
audio.addEventListener('pause',()=>{
  // Our own teardown (reconnect / station change) also pauses; its event can
  // arrive after internalPause is reset, so only a pause while live counts.
  if(internalPause||!userWantsPlay||state!=='live')return;
  // Backgrounded by the OS: try to keep the stream going.
  if(document.visibilityState==='hidden'){setTimeout(()=>{if(userWantsPlay&&audio.paused)audio.play().catch(()=>{})},500);return}
  // Paused from outside (headphones unplugged, lock screen, another page): respect it.
  userWantsPlay=false;clearTimeout(stallTimer);setState('stopped');
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&userWantsPlay&&audio.paused)audio.play().catch(()=>{});
});
window.addEventListener('online',()=>{if(userWantsPlay){reconnectTries=0;audio.dataset.loadedUrl='';startPlayback()}});
window.addEventListener('offline',()=>{if(userWantsPlay)setState('offline')});

function setState(s){
  state=s;
  const live=s==='live',busy=s==='connecting'||s==='reconnecting';
  document.body.classList.toggle('is-playing',live);
  document.body.classList.toggle('is-connecting',busy||s==='offline');
  playBtn.classList.toggle('loading',busy);
  const showPause=userWantsPlay&&s!=='stopped';
  document.getElementById('playIcon').style.display=showPause?'none':'block';
  document.getElementById('pauseIcon').style.display=showPause?'block':'none';
  const txt={
    stopped:rt('radio_stopped','متوقف'),
    connecting:rt('radio_connecting','جارٍ الاتصال…'),
    reconnecting:rt('radio_reconnecting','جارٍ إعادة الاتصال ({n}/5)…',{n:reconnectTries}),
    offline:rt('radio_offline','لا يوجد اتصال بالإنترنت'),
    live:rt('radio_live','مباشر')
  }[s];
  document.getElementById('liveText').textContent=txt;
  if(live)startClock();else if(s==='stopped')stopClock();
  if('mediaSession'in navigator)navigator.mediaSession.playbackState=showPause?'playing':'paused';
  syncIsland();
}
function fmtElapsed(ms){
  const sec=Math.floor(ms/1000),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),ss=sec%60;
  const p=n=>String(n).padStart(2,'0');
  return (h?h+':'+p(m):m)+':'+p(ss);
}
function startClock(){
  clearInterval(clockTimer);
  const tick=()=>{document.getElementById('liveTime').textContent=listenStart?fmtElapsed(Date.now()-listenStart):''};
  tick();clockTimer=setInterval(tick,1000);
}
function stopClock(){clearInterval(clockTimer);document.getElementById('liveTime').textContent=''}

function showRadioError(msg){
  document.getElementById('radioErrorText').textContent=msg;
  document.getElementById('radioError').hidden=false;
}
function hideRadioError(){document.getElementById('radioError').hidden=true}

// ── media session (lock screen / headset / car) ─────────
function updateMediaSession(){
  if(!('mediaSession'in navigator)||!current)return;
  navigator.mediaSession.metadata=new MediaMetadata({
    title:displayName(current),
    artist:catLabel(current.cat)+' · '+rt('radio_live_artist','البث المباشر'),
    album:rt('radio_media_artist','زاد المسلم'),
    artwork:[
      {src:`${_mediaBase}/icons/icon-192.png`,sizes:'192x192',type:'image/png'},
      {src:`${_mediaBase}/icons/icon_512.png`,sizes:'512x512',type:'image/png'}
    ]
  });
  const set=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
  set('play',()=>togglePlay(true));
  set('pause',()=>togglePlay(false));
  set('stop',()=>togglePlay(false));
  set('previoustrack',()=>playAdjacent(-1));
  set('nexttrack',()=>playAdjacent(1));
  set('seekbackward',null);set('seekforward',null);
}

// ============================================================
//  SELECTION / NAVIGATION
// ============================================================
let ctxList=null;   // the list the station was picked from (prev/next walk it)
function selectStation(st,opts={}){
  if(!st)return;
  const changed=!current||current.url!==st.url;
  current=stationByUrl(st.url)||Object.assign({cat:categorize(st.name)},st);
  const disp=displayName(current);
  setHeroTicker(disp);
  document.getElementById('nowCategory').textContent=catLabel(current.cat);
  try{localStorage.setItem('lastStation',JSON.stringify({name:current.name,url:current.url}))}catch(e){}
  checkFavStatus();
  if(changed){
    clearTimeout(reconnectTimer);clearTimeout(stallTimer);
    reconnectTries=0;candIdx=0;listenStart=0;hideRadioError();teardown();
  }
  updateMediaSession();
  if(opts.play)startPlayback();
  else if(changed){userWantsPlay=false;setState('stopped')}
  syncIsland();
}
function playAdjacent(dir){
  const list=(ctxList&&ctxList.length?ctxList:allStations);
  if(!list.length)return;
  let i=current?list.findIndex(s=>s.url===current.url):-1;
  i=i===-1?0:(i+dir+list.length)%list.length;
  selectStation(list[i],{play:true});
}

// ── favorites & recents ──────────────────────────────────
function favs(){const f=readJSON('favRadios',[]);return Array.isArray(f)?f:[]}
function isFav(url){return favs().some(f=>f.url===url)}
function setFav(st,on){
  let f=favs().filter(x=>x.url!==st.url);
  if(on)f.push({name:st.name,url:st.url});
  localStorage.setItem('favRadios',JSON.stringify(f));
}
function checkFavStatus(){
  const on=!!current&&isFav(current.url);
  const b=document.getElementById('favBtn');
  b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));
}
function toggleFavorite(st){
  st=st||current;if(!st)return;
  haptic();
  const on=!isFav(st.url);setFav(st,on);
  showToast(on?rt('radio_fav_added','أُضيفت للمفضلة'):rt('radio_fav_removed','حُذفت من المفضلة'));
  checkFavStatus();
  if(document.getElementById('stationSheet').classList.contains('active'))renderStationSheet();
}
function recents(){const r=readJSON('recentRadios',[]);return Array.isArray(r)?r:[]}
function addRecent(st){
  if(!st)return;
  const r=recents().filter(u=>u!==st.url);r.unshift(st.url);
  try{localStorage.setItem('recentRadios',JSON.stringify(r.slice(0,12)))}catch(e){}
}

// ============================================================
//  STATION SHEET — chips, search, rows
// ============================================================
let sheetCat='all';
function listFor(cat){
  if(cat==='all')return allStations;
  if(cat==='fav')return favs().map(f=>stationByUrl(f.url)||Object.assign({cat:categorize(f.name)},f));
  if(cat==='recent')return recents().map(stationByUrl).filter(Boolean);
  return allStations.filter(s=>s.cat===cat);
}
function openStationSheet(cat){
  haptic();
  sheetCat=cat||'all';
  const si=document.getElementById('stationSearch');si.value='';
  renderStationSheet();
  openSheet('stationSheet');
  setTimeout(()=>{
    const a=document.querySelector('#stationList .selection-item.active');if(a)a.scrollIntoView({block:'center'});
    if(matchMedia('(pointer:fine)').matches)si.focus();   // no surprise keyboard on phones
  },120);
}
function renderChips(){
  const box=document.getElementById('catChips');box.innerHTML='';
  CATS.forEach(c=>{
    const n=listFor(c.id).length;
    if((c.id==='fav'||c.id==='recent')&&!n&&sheetCat!==c.id)return;   // hide empty personal tabs
    const b=document.createElement('button');
    b.type='button';b.className='cat-chip'+(c.id===sheetCat?' active':'');
    b.setAttribute('role','tab');b.setAttribute('aria-selected',String(c.id===sheetCat));
    b.innerHTML=`<span></span><small>${n}</small>`;b.firstChild.textContent=rt(c.key,c.fb);
    b.onclick=()=>{haptic();sheetCat=c.id;renderStationSheet();b.scrollIntoView({inline:'center',block:'nearest'})};
    box.appendChild(b);
  });
}
function renderStationSheet(){
  renderChips();
  const q=normAr(document.getElementById('stationSearch').value);
  const base=listFor(q?'all':sheetCat);            // search always spans every station
  const items=q?base.filter(s=>normAr(s.name).includes(q)||normAr(displayName(s)).includes(q)):base;
  document.getElementById('stationCount').textContent=items.length;
  const el=document.getElementById('stationList');el.innerHTML='';
  if(!items.length){
    const msg=q?rt('radio_no_results','لا نتائج'):sheetCat==='fav'?rt('radio_fav_empty','لا توجد محطات مفضلة بعد'):sheetCat==='recent'?rt('radio_recent_empty','لم تستمع لأي إذاعة بعد'):rt('radio_no_results','لا نتائج');
    el.innerHTML='<div class="list-empty"></div>';el.firstChild.textContent=msg;return;
  }
  const frag=document.createDocumentFragment();
  items.forEach(st=>{
    const row=document.createElement('div');
    const active=!!current&&current.url===st.url;
    row.className='selection-item'+(active?' active':'');
    row.setAttribute('role','option');row.tabIndex=0;if(active)row.setAttribute('aria-selected','true');
    row.innerHTML=`<span class="st-ico">${CAT_ICON[st.cat]||CAT_ICON.reciters}</span><div class="st-main"><span class="st-title"></span><span class="st-sub"></span></div><span class="sel-eq" aria-hidden="true"><i></i><i></i><i></i></span>`;
    row.querySelector('.st-title').textContent=displayName(st);
    row.querySelector('.st-sub').textContent=catLabel(st.cat);
    const fav=document.createElement('button');
    fav.type='button';fav.className='st-fav'+(isFav(st.url)?' on':'');fav.innerHTML=HEART_SVG;
    fav.setAttribute('aria-label',rt('radio_add_fav','إضافة للمفضلة'));fav.setAttribute('aria-pressed',String(isFav(st.url)));
    fav.onclick=e=>{e.stopPropagation();toggleFavorite(st)};
    row.appendChild(fav);
    const pick=()=>{haptic();ctxList=items.slice();selectStation(st,{play:true});closeAllSheets()};
    row.onclick=pick;
    row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}};
    frag.appendChild(row);
  });
  el.appendChild(frag);
}
document.getElementById('stationSearch').addEventListener('input',renderStationSheet);
document.getElementById('stationSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur()}});

// ============================================================
//  SLEEP TIMER (fades out, then stops)
// ============================================================
const SLEEP_OPTS=[15,30,45,60,90,120];
let sleepEnd=0,sleepTick=null,sleepMins=0;
function renderSleep(){
  const grid=document.getElementById('sleepGrid');grid.innerHTML='';
  SLEEP_OPTS.forEach(m=>{
    const b=document.createElement('button');b.type='button';
    b.className='sleep-opt'+(sleepEnd&&sleepMins===m?' active':'');
    b.innerHTML=`${m}<small></small>`;b.querySelector('small').textContent=rt('radio_min_short','{n} د',{n:''}).trim()||'د';
    b.onclick=()=>{haptic();startSleep(m)};
    grid.appendChild(b);
  });
  document.getElementById('sleepCancel').hidden=!sleepEnd;
  document.getElementById('sleepRemaining').hidden=!sleepEnd;
  updateSleepUI();
}
function startSleep(m){
  sleepMins=m;sleepEnd=Date.now()+m*60000;
  clearInterval(sleepTick);sleepTick=setInterval(updateSleepUI,1000);
  showToast(rt('radio_sleep_set','سيتوقف البث بعد {n} دقيقة',{n:m}));
  renderSleep();
  setTimeout(closeAllSheets,350);
}
function cancelSleep(announce){
  sleepEnd=0;sleepMins=0;clearInterval(sleepTick);audio.volume=1;
  if(announce)showToast(rt('radio_sleep_cancelled','تم إلغاء مؤقت النوم'));
  renderSleep();
}
function updateSleepUI(){
  const left=sleepEnd?sleepEnd-Date.now():0;
  const badge=document.getElementById('sleepBadge'),btn=document.getElementById('sleepBtn');
  btn.classList.toggle('on',!!sleepEnd);
  if(!sleepEnd){badge.hidden=true;audio.volume=1;return}
  if(left<=0){
    stopPlayback();cancelSleep(false);showToast(rt('radio_sleep_ended','انتهى مؤقت النوم'));return;
  }
  audio.volume=left<10000?Math.max(0,left/10000):1;      // gentle fade over the last 10 s
  badge.hidden=false;badge.textContent=rt('radio_min_short','{n} د',{n:Math.ceil(left/60000)});
  const rem=document.getElementById('sleepRemaining');
  if(!rem.hidden)rem.textContent=fmtElapsed(left);
}

// ============================================================
//  CONTINUOUS PLAYBACK (js/continuous-player.js)
// ============================================================
function appNavigate(url){if(window.ZadShell)ZadShell.navigate(url);else location.href=url}
function homeUrl(){
  try{const r=document.referrer&&new URL(document.referrer);if(r&&r.origin===location.origin&&r.pathname!==location.pathname)return r.href}catch(e){}
  return '../index.html';
}
function syncIsland(){
  if(!window.ZadShell||!current)return;
  ZadShell.update({title:displayName(current),subtitle:document.getElementById('liveText').textContent,
    playing:userWantsPlay&&state!=='stopped',progress:0,art:document.querySelector('.m-album').src});
}
function armLeaveSoon(){
  if(!window.ZadShell||!ZadShell.shouldFrame())return;
  setTimeout(()=>{if(!document.getElementById('sheetOverlay').classList.contains('active')&&!ZadShell.isOpen())ZadShell.armLeave(homeUrl())},800);
}
if(window.ZadShell){
  ZadShell.init({
    isActive:()=>hasStartedPlayback&&!!current,
    isPlaying:()=>userWantsPlay,
    pause:()=>stopPlayback(),
    toggle:()=>{haptic();if(!userWantsPlay)ZadShell.pauseFrameMedia();togglePlay()},
    next:()=>{haptic();ZadShell.pauseFrameMedia();playAdjacent(1)},
    beforeOpen:()=>{const open=document.getElementById('sheetOverlay').classList.contains('active');if(open)closeAllSheets();return open?350:0}
  });
}

// keyboard (desktop / Bluetooth keyboards)
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select,[contenteditable]')||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key===' '||e.key==='k'){e.preventDefault();togglePlay()}
  else if(e.key==='n'||e.key==='N')playAdjacent(1);
  else if(e.key==='p'||e.key==='P')playAdjacent(-1);
});

// ── init ──────────────────────────────────────────────────
function init(){
  buildStations();
  document.getElementById('stationsPillCount').textContent=allStations.length;
  const last=readJSON('lastStation',null);
  const st=last&&last.url&&(stationByUrl(last.url)||last.name&&last);
  selectStation(st||allStations[0]);
}
window.addEventListener('langchange',()=>{
  if(current){const d=displayName(current);setHeroTicker(d);document.getElementById('nowCategory').textContent=catLabel(current.cat);setState(state);updateMediaSession()}
  if(document.getElementById('stationSheet').classList.contains('active'))renderStationSheet();
});
window.addEventListener('load',()=>{
  setTheme(localStorage.getItem('themeMode')||'dark');
  init();
});
</script>
